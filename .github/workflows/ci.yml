
name: Grade Tracker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, closed]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check Python syntax
        working-directory: grade-tracker
        run: python -m compileall -q .

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: grade-tracker/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -r grade-tracker/requirements-dev.txt

      - name: Run unit tests and coverage
        working-directory: grade-tracker
        run: |
          python -m pytest -k "not integration" --cov=grade_tracker --cov-report=term --cov-report=html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: grade-tracker/htmlcov/

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: grade-tracker/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -r grade-tracker/requirements-dev.txt

      - name: Run integration tests
        working-directory: grade-tracker
        run: python -m pytest -k integration


  deploy:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: [build, unit-tests, integration-tests]
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./grade-tracker
          file: ./grade-tracker/Dockerfile
          push: true
          tags: ghcr.io/blumturner/grade-tracker:latest